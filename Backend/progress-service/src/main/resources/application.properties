spring.application.name=progress-service
server.port=8086

# MySQL (use env vars, never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/progress_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info

# Errors as RFC 7807 ProblemDetail (project convention)
spring.mvc.problemdetails.enabled=true

# Eureka (enabled in S5; off by default so the service starts alone)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# RabbitMQ listeners are not created yet (S7); don't fail if the broker is absent
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.auto-startup=false

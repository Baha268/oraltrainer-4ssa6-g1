spring.application.name=feedback-service
server.port=8085

# --- Base H2 en mémoire (temporaire, en attendant MySQL) ---
spring.datasource.url=jdbc:h2:mem:feedbackdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Console H2 : http://localhost:8085/h2-console (JDBC URL : jdbc:h2:mem:feedbackdb)
spring.h2.console.enabled=true

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Eureka ---
# Désactivé tant que eureka-server n'existe pas (sinon erreurs de connexion en boucle).
# Passer à true quand Eureka tournera sur le port 8761.
eureka.client.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# --- RabbitMQ ---
# Le pom inclut spring-boot-starter-amqp ; la connexion n'est tentée qu'à l'usage.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

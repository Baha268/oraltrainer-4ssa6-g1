spring.application.name=simulation-service
server.port=8084

# --- MySQL (one database per microservice) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/simulation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Eureka ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- RabbitMQ (used from session 7) ---
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# --- Swagger: /swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Exam rules (durations in seconds) ---
simulation.steps.preparation-sec=120
simulation.steps.monologue-sec=120
simulation.steps.interaction-sec=180

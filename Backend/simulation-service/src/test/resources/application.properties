spring.application.name=simulation-service
spring.datasource.url=jdbc:h2:mem:simtest;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
simulation.steps.preparation-sec=120
simulation.steps.monologue-sec=120
simulation.steps.interaction-sec=180
